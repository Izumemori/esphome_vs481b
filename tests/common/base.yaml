# Shared base for the tests.
esphome:
  name: ${name}

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

logger:

external_components:
  - source:
      type: local
      path: ../components

uart:
  baud_rate: 19200
  tx_pin: 16
  rx_pin: 17
  data_bits: 8
  stop_bits: 1
  parity: NONE

vs481b:
  ports:
    - Laptop
    - Switch
    - Xbox
    - Hotplug
